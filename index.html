<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aethel - Venture Past Our Sky</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">

    <style>
        /* Baseline Reset */
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            overflow-x: hidden;
            font-family: 'Barlow', sans-serif;
        }

        /* Liquid-Glass Utilities */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass::before {
            content: "";
            position: absolute; inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255, 255, 255, 0.45) 0%,
                rgba(255, 255, 255, 0.15) 20%,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0) 60%,
                rgba(255, 255, 255, 0.15) 80%,
                rgba(255, 255, 255, 0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .liquid-glass-strong {
            background: rgba(255, 255, 255, 0.01);
            background-blend-mode: luminosity;
            backdrop-filter: blur(50px);
            -webkit-backdrop-filter: blur(50px);
            border: none;
            box-shadow: 4px 4px 4px rgba(0, 0, 0, 0.05), inset 0 1px 1px rgba(255, 255, 255, 0.15);
            position: relative;
            overflow: hidden;
        }
        .liquid-glass-strong::before {
            content: "";
            position: absolute; inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg,
                rgba(255, 255, 255, 0.5) 0%,
                rgba(255, 255, 255, 0.2) 20%,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0) 60%,
                rgba(255, 255, 255, 0.2) 80%,
                rgba(255, 255, 255, 0.5) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        heading: ['"Instrument Serif"', 'serif'],
                        body: ['"Barlow"', 'sans-serif'],
                    },
                    borderRadius: {
                        'none': '0',
                        'sm': '0.125rem',
                        DEFAULT: '9999px',
                        'md': '0.375rem',
                        'lg': '0.5rem',
                        'full': '9999px',
                    }
                }
            }
        }
    </script>
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/framer-motion@11.11.17/dist/framer-motion.js"></script>
    <script>
        window.Motion = window.FramerMotion;
        // Suppress benign key warning loops from Framer Motion dynamic builds
        const originalError = console.error;
        console.error = (...args) => {
            if (args[0] && args[0].includes('Each child in a list')) return;
            originalError.apply(console, args);
        };
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        // Custom Inline Icons
        const ArrowUpRight = ({ className = "h-5 w-5" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                <path d="M7 17L17 7M7 7h10v10" />
            </svg>
        );

        const PlayIcon = ({ className = "h-4 w-4" }) => (
            <svg className={className} viewBox="0 0 24 24" fill="currentColor">
                <polygon points="6,4 20,12 6,20" />
            </svg>
        );

        // FadingVideo Component - Handles rAF-driven crossfading loops manually
        const FadingVideo = ({ src, className, style }) => {
            const videoRef = useRef(null);
            const rafRef = useRef(null);
            const fadingOutRef = useRef(false);

            const FADE_MS = 500;
            const FADE_OUT_LEAD = 0.55;

            const fadeTo = (targetOpacity, duration) => {
                if (!videoRef.current) return;
                cancelAnimationFrame(rafRef.current);

                const element = videoRef.current;
                const startOpacity = parseFloat(element.style.opacity) || 0;
                const opacityDelta = targetOpacity - startOpacity;
                const startTime = performance.now();

                const step = (now) => {
                    const elapsed = now - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    
                    // Simple linear interpolation
                    const currentOpacity = startOpacity + (opacityDelta * progress);
                    element.style.opacity = currentOpacity;

                    if (progress < 1) {
                        rafRef.current = requestAnimationFrame(step);
                    }
                };
                rafRef.current = requestAnimationFrame(step);
            };

            const handleLoadedData = () => {
                if (!videoRef.current) return;
                videoRef.current.style.opacity = "0";
                videoRef.current.play().catch(() => {});
                fadeTo(1, FADE_MS);
            };

            const handleTimeUpdate = () => {
                const video = videoRef.current;
                if (!video) return;

                const remainingTime = video.duration - video.currentTime;
                if (!fadingOutRef.current && remainingTime <= FADE_OUT_LEAD && remainingTime > 0) {
                    fadingOutRef.current = true;
                    fadeTo(0, FADE_MS);
                }
            };

            const handleEnded = () => {
                const video = videoRef.current;
                if (!video) return;

                video.style.opacity = "0";
                setTimeout(() => {
                    if (!video) return;
                    video.currentTime = 0;
                    video.play().catch(() => {});
                    fadingOutRef.current = false;
                    fadeTo(1, FADE_MS);
                }, 100);
            };

            useEffect(() => {
                return () => {
                    cancelAnimationFrame(rafRef.current);
                };
            }, []);

            return (
                <video
                    ref={videoRef}
                    src={src}
                    className={className}
                    style={{ ...style, opacity: 0 }}
                    muted
                    playsInline
                    preload="auto"
                    onLoadedData={handleLoadedData}
                    onTimeUpdate={handleTimeUpdate}
                    onEnded={handleEnded}
                />
            );
        };

        // BlurText Component - Animated character/word system via custom keyframes
        const BlurText = ({ text, className }) => {
            const containerRef = useRef(null);
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold: 0.1 }
                );
                if (containerRef.current) observer.observe(containerRef.current);
                return () => observer.disconnect();
            }, []);

            const words = useMemo(() => text.split(" "), [text]);

            return (
                <p 
                    ref={containerRef} 
                    className={className}
                    style={{ display: 'flex', flexWrap: 'wrap', justifyContent: 'center', rowGap: '0.1em' }}
                >
                    {words.map((word, idx) => (
                        <motion.span
                            key={idx}
                            initial={{ filter: 'blur(10px)', opacity: 0, y: 50 }}
                            animate={isVisible ? {
                                filter: ['blur(10px)', 'blur(5px)', 'blur(0px)'],
                                opacity: [0, 0.5, 1],
                                y: [50, -5, 0]
                            } : {}}
                            transition={{
                                duration: 0.7,
                                times: [0, 0.5, 1],
                                ease: "easeOut",
                                delay: (idx * 100) / 1000
                            }}
                            style={{ display: 'inline-block', marginRight: '0.28em' }}
                        >
                            {word}
                        </motion.span>
                    ))}
                </p>
            );
        };

        // Section 1: Hero Component
        const HeroSection = () => {
            const entryAnimation = {
                initial: { filter: "blur(10px)", opacity: 0, y: 20 },
                animate: { filter: "blur(0px)", opacity: 1, y: 0 },
                transition: { duration: 0.8, ease: "easeOut" }
            };

            return (
                <section className="relative w-screen h-screen overflow-hidden bg-black flex flex-col justify-between">
                    {/* Hero Background Video setup */}
                    <FadingVideo 
                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4"
                        className="absolute left-1/2 top-0 -translate-x-1/2 object-cover object-top z-0"
                        style={{ width: "120%", height: "120%" }}
                    />

                    {/* Navigation Chrome */}
                    <nav className="fixed top-4 left-0 w-full px-8 lg:px-16 flex items-center justify-between z-50">
                        <div className="w-12 h-12 rounded-full liquid-glass flex items-center justify-center text-white font-heading italic text-2xl lowercase select-none">
                            a
                        </div>
                        <div className="hidden lg:flex items-center liquid-glass rounded-full p-1.5 gap-1">
                            {['Home', 'Voyages', 'Worlds', 'Innovation', 'Plan Launch'].map((link) => (
                                <a key={link} href="#" className="px-3 py-2 text-sm font-medium text-white/90 font-body hover:text-white transition-colors">
                                    {link}
                                </a>
                            ))}
                            <button className="bg-white text-black px-4 py-2 rounded-full text-sm font-medium font-body flex items-center gap-1.5 whitespace-nowrap hover:bg-white/90 transition-colors">
                                Claim a Spot <ArrowUpRight className="h-4 w-4" />
                            </button>
                        </div>
                        <div className="w-12 h-12 invisible" /> {/* Spacer */}
                    </nav>

                    {/* Main Layout Area */}
                    <div className="relative z-10 flex-1 flex flex-col items-center justify-center pt-24 px-4 text-center">
                        {/* Dynamic Badge */}
                        <motion.div 
                            {...entryAnimation}
                            transition={{ ...entryAnimation.transition, delay: 0.4 }}
                            className="liquid-glass rounded-full p-1 flex items-center gap-3 mb-6"
                        >
                            <span className="bg-white text-black px-3 py-1 text-xs font-semibold rounded-full font-body">New</span>
                            <span className="text-sm text-white/90 pr-3 font-body font-medium">Maiden Crewed Voyage to Mars Arrives 2026</span>
                        </motion.div>

                        {/* Animated Typography */}
                        <BlurText 
                            text="Venture Past Our Sky Across the Universe"
                            className="text-6xl md:text-7xl lg:text-[5.5rem] font-heading italic text-white leading-[0.8] max-w-3xl tracking-[-4px]"
                        />

                        {/* Content Copy */}
                        <motion.p 
                            {...entryAnimation}
                            transition={{ ...entryAnimation.transition, delay: 0.8 }}
                            className="mt-6 text-sm md:text-base text-white/90 max-w-2xl font-body font-light leading-tight"
                        >
                            Discover the universe in ways once unimaginable. Our pioneering vessels and breakthrough engineering bring deep-space exploration within reach—secure and extraordinary.
                        </motion.p>

                        {/* Interactive Anchors */}
                        <motion.div 
                            {...entryAnimation}
                            transition={{ ...entryAnimation.transition, delay: 1.1 }}
                            className="flex items-center gap-6 mt-8"
                        >
                            <button className="liquid-glass-strong rounded-full px-5 py-2.5 text-sm font-medium text-white font-body flex items-center gap-2 hover:bg-white/5 transition-all">
                                Start Your Voyage <ArrowUpRight className="h-5 w-5" />
                            </button>
                            <button className="flex items-center gap-2 text-sm font-medium text-white font-body group">
                                <span className="w-8 h-8 rounded-full border border-white/20 flex items-center justify-center group-hover:bg-white/10 transition-colors">
                                    <PlayIcon className="h-3 w-3 fill-current text-white" />
                                </span>
                                View Liftoff
                            </button>
                        </motion.div>

                        {/* Structural Info Cards */}
                        <motion.div 
                            {...entryAnimation}
                            transition={{ ...entryAnimation.transition, delay: 1.3 }}
                            className="flex items-stretch gap-4 mt-12"
                        >
                            {/* Card 1 */}
                            <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem] flex flex-col justify-between items-start text-left">
                                <svg className="h-7 w-7 text-white mb-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.2">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z" />
                                </svg>
                                <div>
                                    <div className="font-heading italic text-white text-4xl tracking-[-1px] leading-none">34.5 Min</div>
                                    <div className="text-xs text-white/70 font-body font-light mt-2">Average Videos Watch Time</div>
                                </div>
                            </div>
                            
                            {/* Card 2 */}
                            <div className="liquid-glass p-5 w-[220px] rounded-[1.25rem] flex flex-col justify-between items-start text-left">
                                <svg className="h-7 w-7 text-white mb-8" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="1.2">
                                    <path strokeLinecap="round" strokeLinejoin="round" d="M12 21a9.004 9.004 0 0 0 8.716-6.747M12 21a9.004 9.004 0 0 1-8.716-6.747M12 21c2.485 0 4.5-4.03 4.5-9S14.485 3 12 3m0 18c-2.485 0-4.5-4.03-4.5-9S9.515 3 12 3m0 0a9.004 9.004 0 0 1 8.716 6.747M12 3a9.004 9.004 0 0 0-8.716 6.747M3 12h18" />
                                </svg>
                                <div>
                                    <div className="font-heading italic text-white text-4xl tracking-[-1px] leading-none">2.8B+</div>
                                    <div className="text-xs text-white/70 font-body font-light mt-2">Users Across the Globe</div>
                                </div>
                            </div>
                        </motion.div>
                    </div>

                    {/* Integrated Partnership Bar */}
                    <motion.div 
                        {...entryAnimation}
                        transition={{ ...entryAnimation.transition, delay: 1.4 }}
                        className="relative z-10 flex flex-col items-center gap-4 pb-8"
                    >
                        <div className="liquid-glass rounded-full px-3.5 py-1 text-[11px] font-medium text-white/80 font-body tracking-wider uppercase">
                            Collaborating with top aerospace pioneers globally
                        </div>
                        <div className="flex items-center justify-center gap-12 md:gap-16 font-heading italic text-white text-2xl md:text-3xl tracking-tight opacity-90">
                            <span>Aeon</span>
                            <span>Vela</span>
                            <span>Apex</span>
                            <span>Orbit</span>
                            <span>Zeno</span>
                        </div>
                    </motion.div>
                </section>
            );
        };

        // Section 2: Capabilities Matrix Component
        const CapabilitiesSection = () => {
            const cardsData = [
                {
                    title: "AI Scenery",
                    iconPath: "M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21H5Zm1-4h12l-3.75-5-3 4L9 13l-3 4Z",
                    tags: ["Natural Context", "Photo Realism", "Infinite Settings", "Eco-Vibe"],
                    body: "AI analyzes your product to create indistinguishable natural environments — from Icelandic cliffs to misty forests."
                },
                {
                    title: "Batch Production",
                    iconPath: "M4 6.47 5.76 10H20v8H4V6.47M22 4h-4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.89-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4Z",
                    tags: ["Scale Fast", "Visual Consistency", "Time Saver", "Ready to Post"],
                    body: "Style your entire product line in minutes. Create a unified visual identity for catalogues and social media without weeks of retouching."
                },
                {
                    title: "Smart Lighting",
                    iconPath: "M9 21c0 .55.45 1 1 1h4c.55 0 1-.45 1-1v-1H9v1Zm3-19C8.14 2 5 5.14 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26c1.81-1.27 3-3.36 3-5.74 0-3.86-3.14-7-7-7Z",
                    tags: ["Ray Tracing", "Physical Shadows", "Studio Quality", "Sunlight Sync"],
                    body: "Automatic lighting and material adjustment. Achieve flawless integration with realistic shadows and sunlight."
                }
            ];

            return (
                <section className="relative w-screen min-h-screen bg-black overflow-hidden flex flex-col justify-between">
                    {/* Full Bleed Background Canvas */}
                    <FadingVideo 
                        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_094631_d30ab262-45ee-4b7d-99f3-5d5848c8ef13.mp4"
                        className="absolute inset-0 w-full h-full object-cover z-0"
                    />

                    {/* Section Layout Container */}
                    <div className="relative z-10 px-8 md:px-16 lg:px-20 pt-28 pb-16 flex flex-col min-h-screen w-full justify-between">
                        {/* Typography Header Group */}
                        <div className="mb-auto">
                            <span className="text-sm font-body font-medium text-white/60 tracking-wider block mb-4">// Capabilities</span>
                            <h2 className="font-heading italic text-white text-6xl md:text-7xl lg:text-[6rem] leading-[0.9] tracking-[-3px]">
                                Production<br/>evolved
                            </h2>
                        </div>

                        {/* Core Cards Component Pipeline Grid */}
                        <div className="grid grid-cols-1 md:grid-cols-3 gap-6 mt-16 w-full">
                            {cardsData.map((card, i) => (
                                <div 
                                    key={i}
                                    className="liquid-glass rounded-[1.25rem] p-6 min-h-[360px] flex flex-col justify-between align-stretch hover:bg-white/[0.02] transition-colors duration-500"
                                >
                                    {/* Card Header Layer */}
                                    <div className="flex items-start justify-between gap-4">
                                        <div className="w-11 h-11 rounded-[0.75rem] liquid-glass flex items-center justify-center text-white flex-shrink-0">
                                            <svg className="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                                                <path d={card.iconPath} />
                                            </svg>
                                        </div>
                                        <div className="flex flex-wrap justify-end gap-1.5 max-w-[75%]">
                                            {card.tags.map((tag, tIdx) => (
                                                <span key={tIdx} className="liquid-glass rounded-full px-2.5 py-1 text-[11px] text-white/80 font-body font-normal tracking-wide whitespace-nowrap">
                                                    {tag}
                                                </span>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Layout Spacer */}
                                    <div className="flex-1" />

                                    {/* Card Content Base Layer */}
                                    <div className="mt-6">
                                        <h3 className="font-heading italic text-white text-3xl md:text-4xl tracking-[-1px] leading-none">
                                            {card.title}
                                        </h3>
                                        <p className="mt-3 text-sm text-white/80 font-body font-light leading-snug max-w-[32ch]">
                                            {card.body}
                                        </p>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </section>
            );
        };

        // Main App Integration Core
        const App = () => {
            return (
                <main className="w-screen bg-black selection:bg-white selection:text-black">
                    <HeroSection />
                    <CapabilitiesSection />
                </main>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
